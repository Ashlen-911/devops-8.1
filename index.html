<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin: 0;
            font-size: 2.5rem;
        }
        p {
            color: #5f6368;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>My name is Ashlen</h1>
        <p>Welcome to my test page!</p>
    </div>

</body>
</html>
